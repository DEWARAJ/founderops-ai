[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "founderops-ai"
version = "0.2.0"
description = "Auditable, human-in-the-loop AI recruiting operations workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.60,<3",
  "pydantic>=2.10,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
founderops = "founderops.main:run"
founderops-eval = "founderops.evaluation:run"

[tool.hatch.build.targets.wheel]
packages = ["src/founderops"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "founderops/configs"
"evals" = "founderops/evals"
"static" = "founderops/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=founderops --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
